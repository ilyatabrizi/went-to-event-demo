<script>
/* set language + direction before first paint */
(function () {
  try {
    var q = new URLSearchParams(location.search).get('lang');
    var s = JSON.parse(localStorage.getItem('wte.v1') || 'null');
    var l = (q === 'en' || q === 'fa') ? q : (s && s.lang) || 'fa';
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
  } catch (e) {}
  /* theme before first paint: ?theme= > saved choice > dark (the brand's own) */
  try {
    var qt = new URLSearchParams(location.search).get('theme');
    var t = (qt === 'light' || qt === 'dark') ? qt : localStorage.getItem('wte.theme');
    t = t === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    var m = document.querySelector('meta[name=theme-color]');
    if (m) m.setAttribute('content', t === 'light' ? '#F4F0E9' : '#0E0B10');
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
})();
</script>
